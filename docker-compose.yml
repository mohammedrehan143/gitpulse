version: "3.8"

networks:
  gitpulse-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  # ----------------------------------------------------------------------------
  # Relational Database: PostgreSQL 16 (Local Supabase Proxy / Standalone)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gitpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitpulse
      POSTGRES_USER: gitpulse_admin
      POSTGRES_PASSWORD: gitpulse_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gitpulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpulse_admin -d gitpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Caching and Ephemeral Broker: Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gitpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - gitpulse-network

  # ----------------------------------------------------------------------------
  # Observability: Prometheus & Grafana
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: gitpulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gitpulse-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: gitpulse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/grafana/gitpulse_dashboard.json:/var/lib/grafana/dashboards/gitpulse_dashboard.json:ro
      - grafana_data:/var/lib/grafana
    networks:
      - gitpulse-network
    depends_on:
      - prometheus

  # ----------------------------------------------------------------------------
  # Backend API & Ingestion Engine (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: gitpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=gitpulse
      - POSTGRES_USER=gitpulse_admin
      - POSTGRES_PASSWORD=gitpulse_secure_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gitpulse-network

  # ----------------------------------------------------------------------------
  # Frontend Application (React + Vite)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: gitpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - gitpulse-network
