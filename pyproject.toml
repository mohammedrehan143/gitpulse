[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "0.1.0"
description = "GitPulse — GitHub Activity Analytics Data Engineering Platform & Multi-Agent Orchestration System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "GitPulse Systems Architecture Team", email = "architecture@gitpulse.internal" }
]
keywords = [
    "github-analytics",
    "data-engineering",
    "multi-agent",
    "kafka",
    "spark",
    "fastapi",
    "react",
    "orchestration"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
streaming = [
    "kafka-python>=2.0.2",
    "confluent-kafka>=2.3.0",
]
storage = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pyiceberg>=0.6.0",
    "pyarrow>=15.0.0",
    "minio>=7.2.5",
]
spark = [
    "pyspark>=3.5.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.2",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
gitpulse-agent = "agent_runtime.main:cli"
gitpulse-api = "backend.src.gitpulse.api.main:start"

[tool.setuptools.packages.find]
where = ["backend/src", "."]
include = ["gitpulse*", "agent_runtime*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "agent_runtime/tests",
    "backend/tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "frontend"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | frontend
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "frontend/",
    "build/",
    "dist/"
]
