name: GitPulse CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  agent-runtime-tests:
    name: Agent Runtime & Governance Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Quality Gate 1 - Static Analysis & Linting
        run: |
          ruff check agent_runtime backend
          black --check agent_runtime backend

      - name: Quality Gate 2 - Automated Test Suites
        run: |
          pytest agent_runtime/tests backend/tests -v

      - name: Quality Gate 3 - Secrets & Security Scan
        run: |
          python -m agent_runtime.main gates

  frontend-validation:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
